name: Sync FASB Standards

on:
  schedule:
    - cron: '0 0 * * 0' # Runs automatically every Sunday at midnight
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants repository push access
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # Target main branch explicitly
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Fetch FASB Data
        run: python fetch_fasb.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add knowledge_base/fasb_updates.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update FASB knowledge base" && git push origin main)
